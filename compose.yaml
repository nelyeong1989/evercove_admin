services:
  database:
    image: mysql:8.0
    container_name: evercove_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - '3309:3306'
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - evercove_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: evercove_phpmyadmin
    restart: always
    environment:
      PMA_HOST: database
    ports:
      - '8082:80'
    networks:
      - evercove_network

volumes:
  db_data:

networks:
  evercove_network: